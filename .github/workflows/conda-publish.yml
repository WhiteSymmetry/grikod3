name: Conda-Build, Test, and Publish Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diagnose Git tags
        shell: bash
        run: |
          set -euo pipefail
          echo "--- Git status ---"
          git status --short
          echo "--- Tags ---"
          git tag --list
          echo "--- Current commit ---"
          git log -1 --oneline --decorate
          echo "--- Latest reachable tag (if any) ---"
          git describe --tags --abbrev=0 || true

      - name: Setup Miniconda for Python ${{ matrix.python-version }}
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-activate-base: false
          python-version: "${{ matrix.python-version }}"
          channels: conda-forge,defaults
          channel-priority: strict

      - name: Install Conda-Build
        shell: bash
        run: |
          set -euo pipefail
          conda install -n base -y conda-build anaconda-client

      - name: Build package for Python ${{ matrix.python-version }}
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$PKG_VERSION" ]; then
            PKG_VERSION="0.0.0.dev$(git rev-parse --short HEAD)"
          fi
          PKG_VERSION="${PKG_VERSION#v}"

          echo "Building version: ${PKG_VERSION} for Python ${{ matrix.python-version }}"

          mkdir -p dist

          # Geçici varyant dosyası, bu matrix işi için tek Python sürümü seçer.
          printf 'python:\n  - "%s"\n' \
            "${{ matrix.python-version }}" > "${RUNNER_TEMP}/ci-variants.yaml"

          conda build . \
            --variant-config-files "${RUNNER_TEMP}/ci-variants.yaml" \
            --output-folder ./dist

          PACKAGE_COUNT="$(find dist -type f \( -name '*.conda' -o -name '*.tar.bz2' \) | wc -l)"
          if [ "$PACKAGE_COUNT" -eq 0 ]; then
            echo "HATA: Hiçbir conda paketi oluşturulmadı."
            exit 1
          fi

          echo "Oluşturulan paketler:"
          find dist -type f \( -name '*.conda' -o -name '*.tar.bz2' \) -print

      - name: Create test environment
        shell: bash
        run: |
          set -euo pipefail
          conda create -n test-env -y \
            "python=${{ matrix.python-version }}" \
            pytest \
            pytest-cov

      - name: Run development tests
        shell: bash
        run: |
          set -euo pipefail
          conda run -n test-env --no-capture-output \
            python -m pytest tests/ --cov=adnus

      - name: Install and test the built package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_FILE="$(find dist -type f \( -name '*.conda' -o -name '*.tar.bz2' \) | head -n 1)"
          if [ -z "$PACKAGE_FILE" ]; then
            echo "HATA: Test edilecek conda paketi bulunamadı."
            exit 1
          fi

          echo "Installing: $PACKAGE_FILE"
          conda install -n test-env -y "$PACKAGE_FILE"

          conda run -n test-env --no-capture-output \
            python -c "import adnus; print('Import successful for Python ${{ matrix.python-version }}!')"

      - name: Upload package to Anaconda Cloud
        if: success() && github.event_name == 'release'
        shell: bash
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "HATA: ANACONDA_TOKEN secret tanımlı değil."
            exit 1
          fi

          mapfile -t PACKAGE_FILES < <(
            find dist -type f \( -name '*.conda' -o -name '*.tar.bz2' \)
          )

          if [ "${#PACKAGE_FILES[@]}" -eq 0 ]; then
            echo "HATA: Yüklenecek conda paketi bulunamadı."
            exit 1
          fi

          echo "Yüklenecek paketler:"
          printf '%s\n' "${PACKAGE_FILES[@]}"

          conda run -n base anaconda \
            -t "$ANACONDA_TOKEN" \
            upload "${PACKAGE_FILES[@]}" \
            --label main \
            --skip-existing

      - name: Cleanup test environment
        if: always()
        shell: bash
        run: |
          conda env remove -n test-env -y || true
